# Minemon graphics preset for an AMD Vega 8 (integrated GPU, 6 GB RAM). Goal: looks good, 30+ fps.
# Every key here is listed in Luanti 5.17.0 builtin/settingtypes.txt (scripts/build_windows.sh checks this).
# Shipped as builds/Minemon/minetest.conf. Fallback for slow machines: presets/low.conf.

# Draw distance in nodes (default 190). Fewer blocks to draw is the biggest saving on a weak GPU.
viewing_range = 120

# Fog hides the far edge of the view range, so the cut-off looks natural and does not pop.
enable_fog = true

# Dynamic shadows give the atmosphere; the keys below keep their cost low.
enable_dynamic_shadows = true
# 1024 instead of 2048: a quarter of the shadow map memory and fill work.
shadow_map_texture_size = 1024
# 16-bit shadow map: half the memory bandwidth of the 32-bit default, which matters on an iGPU.
shadow_map_texture_32bit = false
# No extra filtering passes over the shadow map (0 = off).
shadow_filters = 0
# Shadows only near the player (default 140), where they are visible anyway.
shadow_map_max_distance = 60

# Post-processing must be on for bloom, FXAA and auto exposure below.
enable_post_processing = true
# Light bloom on bright surfaces (sun, lava, water glints). One extra blur pass.
enable_bloom = true
# Automatic exposure: brightness follows the scene, from dark caves to daylight. Small cost.
enable_auto_exposure = true
# Volumetric light (godrays) off: it is too expensive for a Vega 8.
enable_volumetric_lighting = false

# FXAA: the cheapest real anti-aliasing, one post pass.
fxaa = true
# Full-scene antialiasing multiplies the GPU work, so it stays off.
antialiasing = none

# Waving leaves, plants and water: movement makes the world feel alive; the vertex cost is small.
enable_waving_leaves = true
enable_waving_plants = true
enable_waving_water = true

# Mipmaps stop distant textures from shimmering; they cost little memory.
mip_map = true
# Anisotropic filtering keeps ground and paths sharp at a viewing angle; cheap on modern GPUs.
anisotropic_filter = true

# Smooth lighting: softer shading on block edges, a visible gain for very little cost.
smooth_lighting = true

# Cap the frame rate at 60; uncapped rates waste power and heat on a laptop iGPU.
fps_max = 60
# VSync off: it adds input lag and can drop the fps to half when a frame is late.
vsync = false

# Hostile vanilla mobs off: Minemon creatures replace the wild life (T-21a). Passive farm animals and villagers stay.
# Keys with a colon are mod settings; build_windows.sh checks only the plain keys above.
